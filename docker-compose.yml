services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "9080:9080"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
